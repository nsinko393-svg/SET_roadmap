/* ============ старт: вхід через Google, потім підписка на спільну дошку ============ */
let firstLoad = true, unsubs = [];
let gotWork = false, gotPersonal = false, workData = null, personalData = null, legacyTried = false;
const gateEl = document.getElementById("authGate");
function showGate(msg, denied){
  gateEl.hidden = false;
  document.getElementById("gateMsg").textContent = msg || "";
  document.getElementById("gateLogin").hidden = !!denied;
  document.getElementById("gateLogout").hidden = !denied;
}
function stopBoard(){
  unsubs.forEach(u=>{ try{ if(u) u(); }catch(e){} });
  unsubs = []; gotWork = gotPersonal = false; workData = personalData = null; legacyTried = false;
}
function finishRender(){
  const snap = splitState();
  lastSaved.work = JSON.stringify(snap.work);
  lastSaved.personal = JSON.stringify(snap.personal);
  /* цей знімок прийшов з фонової синхронізації (не з локальної дії користувача) —
     не чіпаємо вже відкриту хмарку, щоб не зірвати клік чи "Точно видалити?" */
  suppressPopRerender = !!ui.sel;
  render();
  suppressPopRerender = false;
  if(firstLoad){
    firstLoad = false;
    toast(!firebaseReady ? "Firebase не налаштовано — дошка працює лише в цьому вікні, без спільного доступу."
      : isViewer() ? "Режим перегляду: усі робочі гілки видно, додавати задачі можна кнопкою «+ Задача»." : "");
    if(isPhone()){ ui.page = "day"; ui.agendaDay = todayISO(); render(); }
    else requestAnimationFrame(scrollToToday);
  }
}
function showMigrateBar(){
  const cats = state.categories || [];
  const cnt = sc => cats.filter(c=>catScope(c)===sc).reduce((n,c)=>n+c.branches.length,0);
  document.getElementById("migrateText").textContent =
    "Знайдено стару єдину дошку. Після розділення: «SET University» — "+cnt("work")+" гілок, «"+PERSONAL_NAME+"» — "+cnt("personal")+
    " гілок. Стара копія в базі лишиться недоторканою. Перевірте числа й натисніть кнопку.";
  document.getElementById("migrateBar").hidden = false;
}
function ready(){
  if(!gotWork || !gotPersonal) return;
  if(workData || personalData){
    state = { v:2,
      categories: [].concat((workData && workData.categories) || [], (personalData && personalData.categories) || []),
      ideas: (personalData && personalData.ideas) || [],
      queues: (personalData && personalData.queues) || {} };
    migratePending = false;
    document.getElementById("migrateBar").hidden = true;
    finishRender();
    return;
  }
  if(isViewer()){
    state = { v:2, categories:[], ideas:[], queues:{} };
    toast("Дошку ще не налаштовано власником.");
    finishRender();
    return;
  }
  /* власник, нових документів ще немає: шукаємо стару єдину дошку для міграції */
  if(legacyTried) return;
  legacyTried = true;
  refs.legacy.get().then(snap=>{
    const old = snap.exists ? snap.data() : null;
    if(old && Array.isArray(old.categories)){
      state = { v:2, categories: old.categories, ideas: old.ideas||[], queues: old.queues||{} };
      migratePending = true;
      showMigrateBar();
    } else if(!state){
      state = seed();
    }
    finishRender();
  }).catch(()=>{ if(!state) state = seed(); finishRender(); });
}
function startBoard(){
  if(unsubs.length) return;
  if(firebaseReady) toast("Підключення до спільної дошки…");
  const fail = err=>{
    stopBoard();
    if(err && err.code==="permission-denied"){
      const email = fbAuth && fbAuth.currentUser ? fbAuth.currentUser.email : "цього акаунта";
      showGate("Для "+email+" доступу немає. Попросіть власника дошки додати вашу пошту.", true);
      return;
    }
    toast("Немає з'єднання з дошкою: "+(err&&err.message||err));
  };
  if(isViewer()) gotPersonal = true;
  unsubs.push(refs.work.onSnapshot(snap=>{ workData = snap.exists ? snap.data() : null; gotWork = true; ready(); }, fail));
  if(!isViewer()) unsubs.push(refs.personal.onSnapshot(snap=>{ personalData = snap.exists ? snap.data() : null; gotPersonal = true; ready(); }, fail));
}
function logout(){ fbAuth.signOut().then(()=>location.reload()); }
document.getElementById("gateLogout").onclick = logout;
document.getElementById("btnLogout").onclick = logout;
document.getElementById("gateLogin").onclick = ()=>{
  const p = new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({prompt:"select_account"});
  document.getElementById("gateMsg").textContent = "Відкриваю вікно входу…";
  fbAuth.signInWithPopup(p).catch(err=>{
    document.getElementById("gateMsg").textContent = "Не вдалося увійти: "+(err&&err.message||err);
  });
};
function applyRole(){
  document.body.classList.toggle("role-viewer", isViewer());
  document.body.classList.toggle("role-owner", !isViewer());
}
if(!firebaseReady || !fbAuth){
  applyRole(); gateEl.hidden = true; startBoard();
} else {
  fbAuth.onAuthStateChanged(user=>{
    if(!user){ stopBoard(); showGate(""); return; }
    const em = String(user.email||"").toLowerCase();
    const r = OWNERS.indexOf(em)>=0 ? "owner" : VIEWERS.indexOf(em)>=0 ? "viewer" : null;
    if(!r || !user.emailVerified){
      stopBoard();
      showGate("Для "+(em||"цього акаунта")+" доступу немає. Попросіть власника дошки додати вашу пошту.", true);
      return;
    }
    role = r; me = em; applyRole();
    gateEl.hidden = true;
    document.getElementById("btnLogout").hidden = false;
    startBoard();
  });
}
})();
</script>

<script>
/* лише для телефона: закриває висувні меню після вибору пункту (на ПК нічого не робить) */
(function(){
  const nav=document.getElementById("mNav"), menu=document.getElementById("mMenu");
  if(!nav||!menu) return;
  document.addEventListener("click",e=>{
    if(e.target.closest(".menu-wrap button")) menu.checked=false;
    if(e.target.closest(".rail") && e.target.closest("button,[data-act]")) nav.checked=false;
  }, true);
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ menu.checked=false; nav.checked=false; } });
})();
</script>
