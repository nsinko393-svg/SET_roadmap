<title>Мапа дисциплін</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23D3A029'/%3E%3Ctext x='32' y='43' font-family='Arial,Helvetica,sans-serif' font-size='25' font-weight='700' fill='%23ffffff' text-anchor='middle' letter-spacing='1'%3ESET%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#F7F1E3; --surface:#FFFFFF; --surface-2:#F1E7CF; --surface-3:#E9DBB8;
  --ink:#2B2416; --ink-2:#6B5D45; --ink-3:#9C8F72;
  --line:#E6D9B8; --line-2:#D6C596;
  --accent:#D3A029; --accent-ink:#2B2416; --accent-soft:#F6E6BA;
  --crit:#B23B2E; --warn:#B5651D; --ok:#5C7A3E;
  --shadow-1:0 1px 2px rgba(43,36,22,.09);
  --shadow-2:0 2px 6px rgba(43,36,22,.08), 0 18px 40px -22px rgba(43,36,22,.45);
  --r:8px;
  --label-w:238px;
  --font-ui:"Archivo","Segoe UI",system-ui,sans-serif;
  --font-display:"Newsreader",Georgia,"Times New Roman",serif;
  --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
:root[data-theme="dark"]{
  --ground:#1C1712; --surface:#241E17; --surface-2:#2E271D; --surface-3:#3A3225;
  --ink:#F2E9D8; --ink-2:#C9BCA0; --ink-3:#96896D;
  --line:#3A3225; --line-2:#4A4130;
  --accent:#E8B84B; --accent-ink:#241C0E; --accent-soft:#3A2F16;
  --crit:#E58B72; --warn:#E0A83E; --ok:#8FBF7A;
  --shadow-1:0 1px 2px rgba(0,0,0,.5);
  --shadow-2:0 2px 6px rgba(0,0,0,.4), 0 18px 40px -22px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-ui);font-size:15.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.app{height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:0 18px;height:62px;flex:0 0 auto;
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-.01em}
.brand .sub{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line-2);
  border-radius:var(--r);background:var(--surface);color:var(--ink-2);font-size:13.5px;font-weight:500;white-space:nowrap;
  transition:background .12s,color .12s,border-color .12s}
.btn:hover{background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.btn.sm{height:30px;padding:0 11px;font-size:13px}
.btn.icon{width:36px;padding:0;justify-content:center;font-size:18px}
.seg{display:flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{height:36px;padding:0 13px;font-size:12.5px;font-weight:500;color:var(--ink-3);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.workspace{flex:1;min-height:0;display:grid;grid-template-columns:258px minmax(0,1fr);transition:grid-template-columns .16s}
.workspace[hidden]{display:none}
@media (min-width:901px){
  .workspace.is-focus{grid-template-columns:150px minmax(0,1fr)}
}

.rail{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;transition:background .12s}
.rail-search{padding:14px 14px 10px}
.rail-search input{width:100%;height:36px;padding:0 12px;background:var(--ground);border:1px solid var(--line);
  border-radius:var(--r);font-size:13.5px}
.rail-search input::placeholder{color:var(--ink-3)}
.cat{padding:4px 10px 14px}
.cat-head{display:flex;align-items:center;gap:8px;width:100%;padding:9px 8px;border-radius:var(--r);text-align:left;
  border:1px solid transparent;cursor:pointer}
.cat-head:hover{background:var(--surface-2);border-color:var(--line)}
.cat-head.on{background:var(--accent-soft);border-color:var(--accent)}
.cat-name{flex:1;font-family:var(--font-display);font-size:17.5px;font-weight:600;letter-spacing:-.005em;line-height:1.25;color:var(--ink)}
.cat-count{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2)}
.cat-arrow{color:var(--ink-3);font-size:13px;flex:0 0 auto}
.branch-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 9px 10px 16px;border-radius:var(--r);
  text-align:left;margin-top:2px;border:1px solid transparent}
.branch-item:hover{background:var(--surface-2);border-color:var(--line)}
.branch-item[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.branch-item .dot{width:13px;height:13px;border-radius:4px;flex:0 0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.12) inset}
.branch-item .nm{flex:1;font-size:14.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.branch-item .ct{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);background:var(--surface-3);
  border-radius:8px;padding:1.5px 7px;flex:0 0 auto}
.rail-add{margin:0 14px 18px;display:flex;flex-direction:column;gap:6px}
/* компактний режим (розкрита дисципліна): звужуємо, але НЕ ховаємо назви —
   інакше незручно перемикатись між дисциплінами, тримаючи в голові лише колір */
.rail.mini .rail-search,.rail.mini .rail-add{display:none}
.rail.mini .cat-name{font-size:12.5px}
.rail.mini .cat-count{font-size:9.5px}
.rail.mini .cat-head{padding:7px 5px}
.rail.mini .cat-head [data-act="editCategory"]{display:none}
.rail.mini .branch-item{padding:7px 5px 7px 8px;gap:6px}
.rail.mini .branch-item .nm{font-size:10.5px}
.rail.mini .branch-item .ct{font-size:9px;padding:1px 4px}
.rail.mini .branch-item .dot{width:9px;height:9px}

.canvas-col{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.canvas{overflow:auto;position:relative;background:var(--ground);flex:1;min-height:0}
.grid-inner{position:relative;min-width:min-content;min-height:100%}
.full-grid{position:absolute;top:58px;bottom:0;left:var(--label-w);z-index:0;pointer-events:none}

.af-count{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);background:var(--surface-3);
  border-radius:9px;padding:2.5px 9px}
.af-stats{display:flex;gap:6px;padding:0 0 14px;flex:0 0 auto;flex-wrap:wrap}
.af-stats button{display:flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:13px;
  background:var(--surface-2);border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--ink-2)}
.af-stats button:hover{border-color:var(--ink-3)}
.af-stats button .n{font-family:var(--font-mono)}
.af-stats button.crit{color:var(--crit)}
.af-stats button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.af-stats button.crit.active{color:var(--crit);background:color-mix(in srgb,var(--crit) 16%,transparent);border-color:var(--crit)}
.day-h{display:flex;align-items:baseline;gap:8px;margin:15px 0 8px}
.day-h:first-child{margin-top:0}
.day-h .dn{font-family:var(--font-display);font-size:15.5px;font-weight:700;letter-spacing:0;color:var(--ink)}
.day-h.today .dn{color:var(--ink)}
.day-h.crit .dn{color:var(--crit)}
.day-h .day-add{height:20px;padding:0 7px;font-size:13px;border:1px solid var(--line);border-radius:6px;flex:0 0 auto}
.day-h .day-add:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.day-h .ln{flex:1;height:1px;background:var(--line)}
.day-h .cnt{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)}
.backbar{flex:0 0 auto;z-index:7;display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;
  background:var(--accent-soft);border-bottom:1px solid var(--accent);width:100%}
.backbar .bb-name{font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--ink)}
.ruler{position:sticky;top:0;z-index:6;display:flex;background:var(--surface-2);border-bottom:2px solid var(--line-2);height:58px}
.ruler-pad{position:sticky;left:0;z-index:2;width:var(--label-w);flex:0 0 var(--label-w);background:var(--surface-2);
  border-right:1px solid var(--line-2);display:flex;align-items:flex-end;padding:0 12px 8px;
  font-family:var(--font-mono);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.ruler-scale{position:relative;height:58px;flex:0 0 auto}
.mo{position:absolute;top:0;height:29px;border-left:1px solid var(--line-2);padding:6px 0 0 9px;
  font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--ink);white-space:nowrap;overflow:hidden;
  background:linear-gradient(180deg,var(--surface-3),transparent)}
.tick{position:absolute;top:31px;height:27px;border-left:1px solid var(--line);padding-left:5px;padding-top:2px;
  font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tick.wk{border-left-color:var(--line-2);color:var(--ink)}
.gridline{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.6;pointer-events:none}
.gridline.month{background:var(--line-2);opacity:1}
.weekend{position:absolute;top:0;bottom:0;background:var(--ink);opacity:.045;pointer-events:none}

.cat-band{position:relative;z-index:4;display:flex;align-items:center;height:38px;
  background:var(--surface-2);border-top:1px solid var(--line-2);border-bottom:1px solid var(--line);
  font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-2);
  min-width:100%}
.cat-band .cb-in{position:sticky;left:0;display:flex;align-items:center;gap:10px;padding:0 16px}
.cat-band .cb-n{font-family:var(--font-mono);color:var(--ink-3);font-weight:500;letter-spacing:.1em}
.row{display:flex;border-bottom:1px solid var(--line);position:relative}
.row-label{position:sticky;left:0;z-index:5;width:var(--label-w);flex:0 0 var(--label-w);background:var(--surface);
  border-right:1px solid var(--line-2);padding:10px 12px 8px 16px;display:flex;flex-direction:column;gap:3px;justify-content:center}
.row-label .nm{font-family:var(--font-display);font-size:16.5px;font-weight:600;line-height:1.25;text-align:left;letter-spacing:-.008em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.row-label .nm:hover{color:var(--accent)}
.row-label .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.track{position:relative;height:110px;flex:0 0 auto}
.canvas.focus-mode .track{height:520px}
.canvas.focus-mode .row-label .nm{font-size:22px;white-space:normal;overflow:visible;text-overflow:clip}
.canvas.focus-mode .row-label{padding-left:20px}

.bar{position:absolute;top:58px;height:34px;display:flex;border-radius:5px;box-shadow:var(--shadow-1)}
.canvas.focus-mode .bar{top:210px;height:54px}
.phase{position:relative;height:34px;display:flex;align-items:center;
  font-size:12.5px;font-weight:600;letter-spacing:.005em;white-space:nowrap;cursor:grab;
  border-right:1px solid rgba(255,255,255,.32)}
.canvas.focus-mode .phase{height:54px;font-size:16px}
.ph-in{display:flex;align-items:center;gap:6px;overflow:hidden;width:100%;padding:0 11px}
.phase:first-child{border-radius:5px 0 0 5px}
.phase:last-child{border-radius:0 5px 5px 0;border-right:none}
.phase.sel{box-shadow:inset 0 0 0 2.5px var(--ink)}
.phase .ph-days{margin-left:7px;font-family:var(--font-mono);font-size:10.5px;font-weight:600;opacity:.78}
.edge{position:absolute;top:-3px;bottom:-3px;width:12px;z-index:3;cursor:col-resize}
.edge::after{content:"";position:absolute;left:4.5px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--ink);
  opacity:0;transition:opacity .12s}
.edge:hover::after{opacity:.5}
.edge.l{left:-6px}.edge.r{right:-6px}

.pin{position:absolute;z-index:4;cursor:grab;display:flex;flex-direction:column-reverse;align-items:flex-start}
.pin.below{flex-direction:column}
.pin .stem{width:1.5px;margin-left:11px;background:var(--ink-3);opacity:.5;flex:0 0 auto}
.pin .head{position:relative;display:flex;flex-direction:column;gap:2px;padding:5px 9px;border-radius:6px;
  background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow-1);max-width:190px;min-width:74px;flex:0 0 auto}
.pin .head:hover{border-color:var(--ink-3)}
.pin-overflow{position:absolute;top:2px;min-width:17px;height:17px;padding:0 3px;display:flex;align-items:center;justify-content:center;
  background:var(--ink);color:var(--ground);font-family:var(--font-mono);font-size:9.5px;font-weight:700;border-radius:4px;
  z-index:4;cursor:pointer;box-shadow:var(--shadow-1)}
.pin-overflow:hover{background:var(--crit)}
.canvas.focus-mode .pin-overflow{top:4px;min-width:22px;height:22px;font-size:12px;border-radius:5px}
.pin.sel .head{border-color:var(--ink);box-shadow:0 0 0 2.5px var(--accent-soft),var(--shadow-1)}
.pin .htop{display:flex;align-items:center;gap:5px}
.pin .glyph{flex:0 0 auto;display:block}
.pin .dt{font-family:var(--font-mono);font-size:12px;font-weight:800;color:var(--ink);letter-spacing:.01em}
.pin .ttl{font-size:11.5px;font-weight:600;line-height:1.28;color:var(--ink-2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pin.done .ttl{text-decoration:line-through;color:var(--ink-3)}
.pin.done .dt{color:var(--ink-3)}
.canvas.focus-mode .pin .head{max-width:250px;min-width:96px;padding:7px 11px}
.canvas.focus-mode .pin .dt{font-size:13.5px}
.canvas.focus-mode .pin .ttl{font-size:13px}
.todayline{position:absolute;top:58px;bottom:0;width:2px;background:var(--crit);z-index:3;pointer-events:none;opacity:.8}
.todaylabel{position:absolute;top:34px;z-index:3;transform:translateX(-50%);font-family:var(--font-mono);font-size:10px;
  font-weight:700;letter-spacing:.08em;color:var(--crit);background:var(--surface-2);padding:1px 6px;pointer-events:none;
  border-bottom:2px solid var(--crit);line-height:20px;white-space:nowrap;border-radius:3px 3px 0 0}

.bucket{margin-bottom:18px}
.bucket-h{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-family:var(--font-mono);font-size:10.5px;
  font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.bucket-h .ln{flex:1;height:1px;background:var(--line)}
.bucket.crit .bucket-h{color:var(--crit)}
.bucket.now .bucket-h{color:var(--warn)}
.task{display:flex;gap:10px;width:100%;text-align:left;padding:10px 11px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--ground);margin-bottom:7px;transition:border-color .12s,transform .12s}
.task:hover{border-color:var(--ink-3);transform:translateX(1px)}
.task .sq{width:3px;border-radius:2px;flex:0 0 auto}
.task .chk{width:19px;height:19px;border-radius:50%;border:2px solid var(--line-2);flex:0 0 auto;
  display:grid;place-items:center;cursor:pointer;background:var(--surface);margin-top:1px}
.task .chk:hover{border-color:var(--accent)}
.task.done .chk{background:var(--ok);border-color:var(--ok)}
.task .chk .ck-mark{opacity:0;font-size:11px;font-weight:700;color:#fff;line-height:1}
.task.done .chk .ck-mark{opacity:1}
.task .tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.task .t1{display:flex;align-items:baseline;gap:8px}
.task .t-nm{font-size:13.5px;font-weight:600;line-height:1.3}
.task.done .t-nm{text-decoration:line-through;color:var(--ink-3)}
.task .t-dt{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--ink-2);margin-left:auto;flex:0 0 auto}
.task .t2{font-size:11.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.task .t-src{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 7px;border-radius:9px;font-size:10.5px;
  font-weight:600;background:var(--surface-2);color:var(--ink-2);flex:0 0 auto}
.chip.st-todo{background:var(--surface-3);color:var(--ink-2)}
.chip.st-postponed{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.chip.st-done{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.empty{padding:24px 6px;color:var(--ink-3);font-size:13px;text-align:center;font-style:italic}
.field{margin-bottom:13px}
.field label,.lbl{display:block;margin-bottom:5px;font-family:var(--font-mono);font-size:10px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;background:var(--ground);border:1px solid var(--line);
  border-radius:var(--r);font-size:13.5px}
.field input[type=date]{cursor:pointer}
.field input[type=color]{padding:2px;height:36px;cursor:pointer}
.field textarea{resize:vertical;min-height:70px;line-height:1.55}

.edit-pop{position:fixed;z-index:35;width:300px;max-width:92vw}
.edit-pop[hidden]{display:none}
.edit-pop .pp-arrow{position:absolute;width:14px;height:14px;background:var(--surface);
  border:1px solid var(--line-2);transform:rotate(45deg)}
.edit-pop.arrow-top .pp-arrow{top:-7px;border-right:none;border-bottom:none}
.edit-pop.arrow-bottom .pp-arrow{bottom:-7px;border-left:none;border-top:none}
.edit-pop .pp-body{position:relative;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;
  box-shadow:var(--shadow-2);padding:14px 14px 12px;max-height:min(76vh,480px);overflow-y:auto}
.edit-pop .pp-close{position:absolute;top:6px;right:6px;width:24px;height:24px;display:grid;place-items:center;
  color:var(--ink-3);border-radius:50%;font-size:12px}
.edit-pop .pp-close:hover{background:var(--surface-2);color:var(--crit)}
.edit-pop .pp-sub{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin:0 26px 10px 0}
.edit-pop .pp-name{font-family:var(--font-display);font-size:16px;font-weight:600;padding:7px 9px}
.edit-pop .pp-days{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);margin:-4px 0 10px}
.edit-pop .pp-note{min-height:56px;font-size:12px;line-height:1.5}
.edit-pop .field{margin-bottom:9px}
.edit-pop .actions{margin-top:2px;flex-wrap:wrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:26px;height:26px;border-radius:5px;border:1px solid rgba(0,0,0,.14)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.hr{height:1px;background:var(--line);margin:15px 0}
.phase-list{display:flex;flex-direction:column;gap:5px}
.phase-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:var(--r);background:var(--ground);
  border:1px solid var(--line);width:100%;text-align:left}
.phase-row:hover{border-color:var(--ink-3)}

function buildCourse(c){
  const start = c.start;
  const end = c.end || addDays(start,55);
  const prepStart = addDays(start,-21), prepEnd = addDays(start,-1);
  let introStart = todayISO();
  if(diffDays(introStart,prepStart) < 1) introStart = addDays(prepStart,-28);
  const spans = [[introStart, addDays(prepStart,-1)],[prepStart,prepEnd],[start,end],[addDays(end,1),addDays(end,21)]];
  const phases = PHASE_PLAN.map((p,i)=>({
    id:uid(), name:p.n, color:p.c, start:spans[i][0], end:spans[i][1],
    note: (i===2 && !c.end) ? p.note+NO_END_WARN : p.note
  }));
  const markers = c.tasks.map(t=>({id:uid(), date:t[0], title:t[1], status:t[2], shape:t[3], color:t[4],
    assignees:t[5]||[], desc:t[6]||"", files:[]}));
  markers.push({id:uid(), date:addDays(start,-3), title:"Перевірка готовності до старту", status:"todo",
    shape:"diamond", color:"#B0793C", assignees:["Назар"], files:[],
    desc:"Пройти чекліст фази «Підготовка до старту» — готовність має бути 100%."});
  markers.push({id:uid(), date:start, title:"Старт курсу", status:"todo", shape:"circle", color:"#3F6B5C",
    assignees:c.who.slice(), files:[], desc:""});
  markers.push({id:uid(), date:addDays(end,14), title:"Закриття: бали, фідбек, звіт", status:"todo",
    shape:"star", color:"#5C7D8A", assignees:c.who.slice(), files:[],
    desc:"Бали узгоджені з викладачем, розіслані студентам, внесені в LMS і «Кумулятивний бал». Перездача організована й оцінена. Фідбек-форма надіслана, звіт викладачу переданий."});
  return {id:uid(), name:c.name, color:c.color, note:c.note, phases, markers};
}

/* ============ похідні ============ */
const allBranches = () => state.categories.flatMap(c => c.branches.map(b => ({cat:c, br:b})));
const branchStart = b => b.phases.length ? b.phases[0].start : todayISO();
const branchEnd   = b => b.phases.length ? b.phases[b.phases.length-1].end : todayISO();
function findBranch(id){ for(const c of state.categories){ const b = c.branches.find(x=>x.id===id); if(b) return {cat:c, br:b}; } return null; }
function findMarker(bid,mid){ const f=findBranch(bid); if(!f) return null; const m=f.br.markers.find(x=>x.id===mid); return m?{cat:f.cat,br:f.br,m}:null; }

function range(){
  if(ui.view==="focus" && ui.focusId){
    const f = findBranch(ui.focusId);
    if(f) return focusRange(f.br);
  }
  const all = allBranches();
  if(!all.length){ const t=todayISO(); return {start:addDays(t,-30), end:addDays(t,60)}; }
  let s = branchStart(all[0].br), e = branchEnd(all[0].br);
  all.forEach(({br})=>{ if(branchStart(br)<s) s=branchStart(br); if(branchEnd(br)>e) e=branchEnd(br); });
  const t = todayISO();
  if(t<s) s=t; if(t>e) e=t;
  return { start: addDays(s,-10), end: addDays(e,14) };
}
function focusRange(b){
  let s = branchStart(b), e = branchEnd(b);
  const t = todayISO();
  if(t<s) s=t; if(t>e) e=t;
  return { start: addDays(s,-9), end: addDays(e,9) };
}
const X = (iso,R) => diffDays(R.start,iso)*ui.px;

/* ============ рендер: лінійка ============ */
function renderRuler(R,total,width){
  let mo="", tick="", grid="";
  let d = fromISO(R.start);
  d.setDate(1);
  while(toISO(d) <= R.end){
    const iso = toISO(d);
    const x = Math.max(0, X(iso,R));
    const nx = new Date(d.getFullYear(), d.getMonth()+1, 1);
    const w = Math.min(width, X(toISO(nx),R)) - x;
    if(w > 2){
      mo += '<div class="mo" style="left:'+x+'px;width:'+w+'px">'+MONTHS_N[d.getMonth()]+' <span style="color:var(--ink-3);font-weight:500">'+d.getFullYear()+'</span></div>';
      if(iso >= R.start) grid += '<div class="gridline month" style="left:'+x+'px"></div>';
    }
    d = nx;
  }
  const stepDays = ui.px >= 20 ? 1 : ui.px >= 9 ? 7 : ui.px >= 4 ? 14 : 30;
  for(let i=0;i<=total;i++){
    const iso = addDays(R.start,i);
    const dt = fromISO(iso);
    const wd = dt.getDay();
    if(ui.px >= 6 && (wd===0||wd===6)) grid += '<div class="weekend" style="left:'+(i*ui.px)+'px;width:'+ui.px+'px"></div>';
    const isTick = stepDays===1 ? true : (stepDays===7||stepDays===14) ? (wd===1 && (stepDays===7 || (i%14<7))) : dt.getDate()===1;
    if(!isTick) continue;
    const x = i*ui.px;
    const lbl = ui.px>=20 ? (WD[wd]+" "+dt.getDate()) : ui.px>=9 ? String(dt.getDate()) : "";
    tick += '<div class="tick'+(wd===1?' wk':'')+'" style="left:'+x+'px">'+lbl+'</div>';
    if(ui.px>=9 && wd===1) grid += '<div class="gridline" style="left:'+x+'px"></div>';
  }
  return {mo, tick, grid};
}

/* ============ рендер: полотно ============ */
/* до 3 "сходинок" міток над фазою і до 3 під нею; що не влізло — в один компактний бейдж-лічильник */
function laneFor(pins, x, w, maxLanes){
  for(let lane=0; lane<maxLanes; lane++){
    if(pins[lane]===undefined) pins[lane] = -1e9;
    if(x > pins[lane] + 6){ pins[lane] = x + w; return lane; }
  }
  return -1;
}
const LANE_TOP = { dash:[8], focus:[16,92,168] };
const LANE_BELOW_TOP = { dash:[], focus:[280,356,432] };
const BAR_TOP = { dash:58, focus:210 };
const BELOW_STEM_H = { dash:10, focus:14 };

function renderCanvas(){
  const R = range();
  const total = diffDays(R.start,R.end);
  const width = total*ui.px;
  const inner = document.getElementById("gridInner");
  const canvasEl = document.getElementById("canvas");
  const q = ui.q.trim().toLowerCase();
  const rl = renderRuler(R,total,width);
  const focusMode = ui.view==="focus" && ui.focusId && findBranch(ui.focusId);
  canvasEl.classList.toggle("focus-mode", !!focusMode);

  const tX = X(todayISO(),R);
  const backbarEl = document.getElementById("backbar");
  if(focusMode){
    const fb = focusMode.br;
    backbarEl.hidden = false;
    backbarEl.innerHTML = '<button class="btn sm" data-act="gotoDashboard">&#8592; Усі дисципліни</button>'+
      '<span class="bb-name">'+esc(fb.name)+'</span><div class="spacer"></div>'+
      '<button class="btn sm" data-act="editBranch" data-b="'+fb.id+'">Редагувати</button>';
  } else {
    backbarEl.hidden = true;
    backbarEl.innerHTML = "";
  }
  let html = "";
  html += '<div class="ruler">'+'<div class="ruler-pad">дисципліна</div>'+
    '<div class="ruler-scale" style="width:'+width+'px">'+rl.mo+rl.tick+
    '<div class="todaylabel" style="left:'+tX+'px">СЬОГОДНІ '+shortDate(todayISO())+'</div></div></div>';
  html += '<div class="full-grid" style="width:'+width+'px">'+rl.grid+'</div>';

  const cats = focusMode ? [focusMode.cat] : state.categories;
  cats.forEach(cat=>{
    let brs = focusMode ? [focusMode.br] : cat.branches.filter(b => !q || b.name.toLowerCase().includes(q) || b.markers.some(m=>m.title.toLowerCase().includes(q)));
    if(!focusMode){
      html += '<div class="cat-band" data-cat-band="'+cat.id+'"><span class="cb-in">'+esc(cat.name)+
        '<span class="cb-n">'+brs.length+'/'+cat.branches.length+'</span></span></div>';
    }
    if(!brs.length){
      html += '<div class="row"><div class="row-label" style="height:52px"><span class="meta">порожньо</span></div>'+
              '<div class="track" style="width:'+width+'px;height:52px"></div></div>';
      return;
    }
    brs.forEach(b=>{
      const bs = branchStart(b), be = branchEnd(b);
      const nDays = diffDays(bs,be)+1;
      html += '<div class="row" data-branch="'+b.id+'">';
      html += '<div class="row-label">'+
        '<button class="nm" data-act="focusBranch" data-b="'+b.id+'" title="'+esc(b.name)+'">'+esc(b.name)+'</button>'+
        '<span class="meta"><span style="width:8px;height:8px;border-radius:2px;background:'+b.color+';display:inline-block"></span>'+
        human(bs)+' — '+human(be)+' · '+nDays+'д</span>'+
        '<span class="meta">'+b.phases.length+' фаз · '+b.markers.length+' міток</span>'+
        '</div>';

      html += '<div class="track" data-track="'+b.id+'" style="width:'+width+'px">';
      // фази
      const x0 = X(bs,R);
      html += '<div class="bar" style="left:'+x0+'px">';
      b.phases.forEach((p,i)=>{
        const w = (diffDays(p.start,p.end)+1)*ui.px;
        const fg = readable(p.color);
        const sel = ui.sel && ui.sel.type==="phase" && ui.sel.phaseId===p.id ? " sel" : "";
        const days = diffDays(p.start,p.end)+1;
        html += '<div class="phase'+sel+'" data-phase="'+p.id+'" data-b="'+b.id+'" title="'+esc(p.name)+' · '+humanFull(p.start)+' — '+humanFull(p.end)+'" '+
          'style="width:'+w+'px;background:'+p.color+';color:'+fg+'">'+
          '<span class="ph-in">'+(w>52 ? '<span style="overflow:hidden;text-overflow:ellipsis">'+esc(p.name)+'</span>'+(w>128?'<span class="ph-days">'+days+'д</span>':'') : '')+'</span>'+
          '<span class="edge l" data-edge="l" data-phase="'+p.id+'" data-b="'+b.id+'"></span>'+
          '<span class="edge r" data-edge="r" data-phase="'+p.id+'" data-b="'+b.id+'"></span>'+
          '</div>';
      });
      html += '</div>';
      // мітки: до 3 сходинок над фазою, до 3 під нею; решта — в один бейдж на візуально сусідніх
      const lanesAbove = [], lanesBelow = [];
      const laneTopsAbove = focusMode ? LANE_TOP.focus : LANE_TOP.dash;
      const laneTopsBelow = focusMode ? LANE_BELOW_TOP.focus : LANE_BELOW_TOP.dash;
      const barTop = focusMode ? BAR_TOP.focus : BAR_TOP.dash;
      const belowStemH = focusMode ? BELOW_STEM_H.focus : BELOW_STEM_H.dash;
      const sorted = b.markers.slice().sort((m1,m2)=> m1.date<m2.date?-1:1);
      const overflowClusters = [];
      sorted.forEach(m=>{
        const x = X(m.date,R);
        const w = Math.min(focusMode?220:190, 74 + m.title.length*3.2);
        let top, stemH, belowCls = "";
        let lane = laneFor(lanesAbove, x, w, laneTopsAbove.length);
        if(lane>=0){
          top = laneTopsAbove[lane];
          stemH = Math.max(4, barTop - top - 46);
        } else {
          lane = laneFor(lanesBelow, x, w, laneTopsBelow.length);
          if(lane>=0){
            top = laneTopsBelow[lane];
            stemH = belowStemH;
            belowCls = " below";
          } else {
            /* не влізло в жодну з 6 сходинок — доклеюємо до сусіднього бейджа поруч
               по шкалі (не обов'язково та сама дата), щоб не плодити купу однакових квадратиків */
            const last = overflowClusters[overflowClusters.length-1];
            if(last && x - last.x < 40){ last.x = x; last.markers.push(m); }
            else overflowClusters.push({x, markers:[m]});
            return;
          }
        }
        const hit = q && m.title.toLowerCase().includes(q);
        html += '<div class="pin'+belowCls+(m.status==="done"?" done":"")+(ui.sel&&ui.sel.type==="marker"&&ui.sel.markerId===m.id?" sel":"")+
          '" data-marker="'+m.id+'" data-b="'+b.id+'" style="left:'+x+'px;top:'+top+'px'+(hit?';z-index:5':'')+'">'+
          '<span class="stem" style="height:'+stemH+'px"></span>'+
          '<span class="head" style="'+(hit?'border-color:'+m.color:'')+'">'+
            '<span class="htop">'+glyph(m.shape,m.color,16)+'<span class="dt">'+shortDate(m.date)+'</span></span>'+
            '<span class="ttl">'+esc(m.title)+'</span></span></div>';
      });
      overflowClusters.forEach(entry=>{
        const ids = entry.markers.map(x=>x.id).join(",");
        html += '<button class="pin-overflow" data-act="openCluster" data-b="'+b.id+'" data-ids="'+ids+'" '+
          'style="left:'+(entry.x-3)+'px" title="'+entry.markers.length+' задач — натисніть, щоб побачити всі">'+
          entry.markers.length+'</button>';
      });
      html += '</div></div>';
    });
  });

  html += '<div class="todayline" style="left:calc(var(--label-w) + '+tX+'px)"></div>';
  inner.innerHTML = html;
}
function shortDate(iso){ const d=fromISO(iso); return pad(d.getDate())+"."+pad(d.getMonth()+1); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function dayHeaderHTML(label,count,cls,date,id){
  const addBtn = date ? '<button class="btn ghost sm day-add" data-act="openTaskPicker" data-date="'+date+'" title="Додати задачу на цей день">+</button>' : '';
  return '<div class="day-h'+(cls?" "+cls:"")+'"'+(id?' id="'+id+'"':'')+'><span class="dn">'+esc(label)+'</span>'+addBtn+'<span class="ln"></span><span class="cnt mono">'+count+'</span></div>';

function weekdayHuman(iso){
  const d = fromISO(iso);
  return WD[d.getDay()]+", "+d.getDate()+" "+MONTHS[d.getMonth()];
}

/* порядок денний — по днях, з фільтром на 4 блоки: прострочено / заплановано / виконано / відкладено */
function agendaHTML(){
  const t = todayISO();
  const q = ui.q.trim().toLowerCase();
  const filter = ui.agendaFilter || "all";
  const items = [];
  state.categories.forEach(c=>c.branches.forEach(b=>b.markers.forEach(m=>{
    if(q && !(m.title.toLowerCase().includes(q) || b.name.toLowerCase().includes(q))) return;
    const cls = classifyMarker(m,t);
    if(filter!=="all" && cls!==filter) return;
    items.push({m,b,c,cls});
  })));
  items.sort((a,z)=> a.m.date===z.m.date ? 0 : (a.m.date<z.m.date?-1:1));

  const overdue = items.filter(i=>i.cls==="overdue");
  const upcoming = items.filter(i=>i.cls==="todo" || i.cls==="postponed");
  const doneAll = items.filter(i=>i.cls==="done").sort((a,z)=> a.m.date<z.m.date?1:(a.m.date>z.m.date?-1:0));

  let html = "";
  let any = false;

  if(overdue.length){
    any = true;
    html += dayHeaderHTML("Прострочено", overdue.length, "crit", null, "ag-overdue") + overdue.map(i=>taskRowHTML(i.m,i.b)).join("");
  }

  const byDay = new Map();
  upcoming.forEach(i=>{ if(!byDay.has(i.m.date)) byDay.set(i.m.date, []); byDay.get(i.m.date).push(i); });
  Array.from(byDay.keys()).sort().forEach(d=>{
    any = true;
    const list = byDay.get(d);
    const isToday = d===t;
    const label = isToday ? "Сьогодні · "+humanFull(d) : weekdayHuman(d);
    html += dayHeaderHTML(label, list.length, isToday?"today":"", d, isToday?"ag-today":null) + list.map(i=>taskRowHTML(i.m,i.b)).join("");
  });

  if(doneAll.length){
    any = true;
    html += '<div class="bucket"><div class="bucket-h">Виконано <span class="ln"></span><span>'+doneAll.length+'</span></div>'+
      doneAll.map(i=>taskRowHTML(i.m,i.b)).join("")+'</div>';
  }

  if(!any) html = '<div class="empty">'+(filter==="all"?"Задач немає. Натисніть «+ Задача», щоб додати першу.":"У цій категорії задач немає.")+'</div>';
  return html;
}

function anchorRectFor(sel){
  if(!sel) return null;
  let el = null;
  if(sel.type==="phase") el = document.querySelector('.phase[data-phase="'+sel.phaseId+'"][data-b="'+sel.branchId+'"]');
  else if(sel.type==="marker") el = document.querySelector('.pin[data-marker="'+sel.markerId+'"][data-b="'+sel.branchId+'"] .head');
  else if(sel.type==="branch"){
    if(ui.view==="focus" && ui.focusId===sel.branchId) el = document.querySelector(".backbar .bb-name");
    if(!el) el = document.querySelector('[data-branch="'+sel.branchId+'"] .row-label .nm');
  }
  else if(sel.type==="category") el = document.querySelector('.cat-head[data-c="'+sel.categoryId+'"]');
  else if(sel.type==="newMarker") el = document.querySelector('[data-act="openTaskPicker"]');
  else if(sel.type==="cluster") el = document.querySelector('.pin-overflow[data-b="'+sel.branchId+'"][data-ids="'+sel.ids+'"]');
  return el ? el.getBoundingClientRect() : null;
}
function positionEditPop(anchorRect){
  const pop = document.getElementById("editPop");
  const popW = pop.offsetWidth || 300;
  pop.classList.remove("arrow-top","arrow-bottom");
  if(!anchorRect){
    const cv = document.getElementById("canvas").getBoundingClientRect();
    pop.style.left = Math.max(8, cv.left + cv.width/2 - popW/2)+"px";
    pop.style.top = (cv.top + 70)+"px";
    return;
  }
  let left = anchorRect.left + anchorRect.width/2 - popW/2;
  left = Math.max(8, Math.min(left, window.innerWidth - popW - 8));
  const popH = pop.querySelector(".pp-body").offsetHeight || 380;
  const spaceAbove = anchorRect.top, spaceBelow = window.innerHeight - anchorRect.bottom;
  let top, arrowClass;
  if(spaceAbove > popH + 16 || spaceAbove > spaceBelow){ top = anchorRect.top - popH - 12; arrowClass = "arrow-bottom"; }
  else { top = anchorRect.bottom + 12; arrowClass = "arrow-top"; }
  /* обов'язково вміщуємо ВСЮ картку у видиму область, інакше хрестик і поля
     виїжджають за межі екрана й стають недосяжними */
  top = Math.max(8, Math.min(top, window.innerHeight - popH - 8));
  pop.style.left = left+"px";
  pop.style.top = top+"px";
  pop.classList.add(arrowClass);
  const arrow = pop.querySelector(".pp-arrow");
  if(arrow) arrow.style.left = (Math.max(16, Math.min(popW-16, (anchorRect.left + anchorRect.width/2) - left)) - 7)+"px";
}
function renderEditPop(){
  const pop = document.getElementById("editPop");
  const sel = ui.sel;
  if(!sel){ pop.hidden = true; return; }
  let html = null;
  if(sel.type==="phase"){
    const f = findBranch(sel.branchId); const p = f && f.br.phases.find(x=>x.id===sel.phaseId);
    if(f && p) html = phasePopHTML(f.br, p, f.br.phases.indexOf(p));
  } else if(sel.type==="branch"){
    const f = findBranch(sel.branchId);
    if(f) html = branchPopHTML(f.br, f.cat);
  } else if(sel.type==="marker"){
    const f = findMarker(sel.branchId, sel.markerId);
    if(f) html = markerPopHTML(f);
  } else if(sel.type==="category"){
    const cat = state.categories.find(c=>c.id===sel.categoryId);
    if(cat) html = categoryPopHTML(cat);
  } else if(sel.type==="newMarker"){
    html = newMarkerPopHTML(sel);
  } else if(sel.type==="cluster"){
    const f = findBranch(sel.branchId);
    const ids = (sel.ids||"").split(",");
    const markers = f ? f.br.markers.filter(m=>ids.includes(m.id)) : [];
    if(f && markers.length) html = clusterPopHTML(f.br, markers);
  }
  if(html===null){ pop.hidden = true; return; }
  document.getElementById("editPopBody").innerHTML = html;
  pop.hidden = false;
  positionEditPop(anchorRectFor(sel));
}

  ws.hidden = !!ui.page;

  else { cv.scrollLeft = sx; cv.scrollTop = sy; }
  document.querySelectorAll("#zoomSeg button").forEach(btn=>btn.setAttribute("aria-pressed", Number(btn.dataset.z)===ui.px));
  /* не перемальовуємо відкриту хмарку, поки користувач ДРУКУЄ в її полі (інакше злітає курсор) —
     але тільки для текстових полів: клік по кнопці в хмарці (Видалити, Створити, Закрити тощо)
     має оновити чи закрити хмарку одразу, а не лишати її "застряглою" зі старими даними */
  const activeInPop = document.getElementById("editPop").contains(document.activeElement);
  const activeIsField = activeInPop && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(!suppressPopRerender && !activeIsField) renderEditPop();
}

function normalizePhases(b){
  b.phases.sort((a,z)=> a.start<z.start?-1:1);
  for(let i=0;i<b.phases.length-1;i++){
    if(b.phases[i].end >= b.phases[i+1].start) b.phases[i].end = addDays(b.phases[i+1].start,-1);
    if(diffDays(b.phases[i].start,b.phases[i].end) < 0) b.phases[i].end = b.phases[i].start;
  }
}
function addBranch(catId, name, start, color){
  const cat = state.categories.find(c=>c.id===catId) || state.categories[0];
  const t = start || todayISO();
  const col = color || PALETTE[(allBranches().length)%PALETTE.length];
  const b = { id:uid(), name: name || "Нова дисципліна", color: col,
    phases:[
      {id:uid(),name:"Підготовка програми",color:tint(col,.28),start:t,end:addDays(t,20),note:""},
      {id:uid(),name:"Викладання",color:col,start:addDays(t,21),end:addDays(t,90),note:""},
      {id:uid(),name:"Фіналізація",color:"#5C7D8A",start:addDays(t,91),end:addDays(t,110),note:""}
    ], markers:[] };
  cat.branches.push(b);
  ui.sel = {type:"branch", branchId:b.id};
  ui.view = "focus"; ui.focusId = b.id;
  save(); render();
  const el = document.querySelector('[data-branch="'+b.id+'"]');
  if(el) el.scrollIntoView({block:"center"});
  renderEditPop();
  if(!name){
    requestAnimationFrame(()=>{ const inp=document.getElementById("bName"); if(inp){ inp.focus(); inp.select(); } });
    toast("Гілку додано — перейменуйте її у хмарці");
  } else {
    toast("Дисципліну «"+name+"» додано");
  }
}
function addCategory(){
  const cat = {id:uid(), name:"Нова категорія", branches:[]};
  state.categories.push(cat);
  ui.sel = {type:"category", categoryId:cat.id};
  save(); render();
  requestAnimationFrame(()=>{ const inp=document.getElementById("catName"); if(inp){ inp.focus(); inp.select(); } });
  toast("Категорію додано — перейменуйте її нижче");
}
function appendPhase(b){
  const last = b.phases[b.phases.length-1];
  const s = last ? addDays(last.end,1) : todayISO();
  b.phases.push({id:uid(), name:"Нова фаза", color:PALETTE[b.phases.length%PALETTE.length], start:s, end:addDays(s,14), note:""});
}
function markerAt(b, date){
  const m = { id:uid(), date, title:"Нова задача", status:"todo", shape:"pin",
    color:PALETTE[(b.markers.length+2)%PALETTE.length], assignees:[], desc:"", files:[] };
  b.markers.push(m); return m;
}

/* ============ перетягування ============ */
function beginDrag(e, spec){
  e.preventDefault();
  const f = findBranch(spec.branchId); if(!f) return;
  const b = f.br;
  const snap = JSON.parse(JSON.stringify({phases:b.phases, markers:b.markers}));
  ui.dragging = Object.assign({startX:e.clientX, snap, b, moved:false}, spec);
  document.body.classList.add("dragging");
  window.addEventListener("pointermove", onDragMove);
  window.addEventListener("pointerup", onDragEnd, {once:true});
}
function onDragMove(e){
  const D = ui.dragging; if(!D) return;
  const dx = e.clientX - D.startX;
  const dd = Math.round(dx/ui.px);
  if(Math.abs(dx) > 3) D.moved = true;
  if(!D.moved) return;
  const b = D.b, snap = D.snap;
  const i = b.phases.findIndex(p=>p.id===D.phaseId);

  if(D.kind==="edge"){
    const sp = snap.phases[i];
    if(D.side==="l"){
      if(i===0){
        const nd = Math.min(addDays(sp.start,dd), addDays(snap.phases[0].end,0));
        b.phases[0].start = diffDays(nd, b.phases[0].end) >= 0 ? nd : b.phases[0].end;
      }else{
        const prev = snap.phases[i-1];
        let nd = addDays(sp.start,dd);
        if(diffDays(prev.start,nd) < 1) nd = addDays(prev.start,1);
        if(diffDays(nd,sp.end) < 0) nd = sp.end;
        b.phases[i].start = nd; b.phases[i-1].end = addDays(nd,-1);
      }
    }else{
      const last = i===b.phases.length-1;
      let nd = addDays(sp.end,dd);
      if(diffDays(sp.start,nd) < 0) nd = sp.start;
      if(!last){
        const next = snap.phases[i+1];
        if(diffDays(nd,next.end) < 1) nd = addDays(next.end,-1);
        b.phases[i].end = nd; b.phases[i+1].start = addDays(nd,1);
      } else b.phases[i].end = nd;
    }
  } else if(D.kind==="phaseMove"){
    b.phases.forEach((p,k)=>{ p.start = addDays(snap.phases[k].start,dd); p.end = addDays(snap.phases[k].end,dd); });
    b.markers.forEach((m,k)=>{ m.date = addDays(snap.markers[k].date,dd); });
  } else if(D.kind==="marker"){
    const k = b.markers.findIndex(m=>m.id===D.markerId);
    if(k>=0) b.markers[k].date = addDays(snap.markers[k].date, dd);
  }
  render();
}
function onDragEnd(){
  const D = ui.dragging;
  window.removeEventListener("pointermove", onDragMove);
  document.body.classList.remove("dragging");
  ui.dragging = null;
  ui.suppressClick = !!(D && D.moved);
  if(D && D.moved){ normalizePhases(D.b); save(); render(); }
}

/* ============ файли задачі ============ */
function currentMarker(){ return (ui.sel && ui.sel.type==="marker") ? findMarker(ui.sel.branchId, ui.sel.markerId) : null; }
function filesHTML(m){
  if(!m.files.length) return '<div style="font-size:11px;color:var(--ink-3)">Файли зберігаються локально у цьому браузері.</div>';
  return m.files.map((f,i)=>'<div class="file">'+
    (f.data && f.type.startsWith("image/") ? '<img src="'+f.data+'" alt="">' : '<span class="ficon">'+esc((f.name.split(".").pop()||"?").slice(0,4).toUpperCase())+'</span>')+
    '<span class="fn">'+esc(f.name)+'</span><span class="fs">'+kb(f.size)+'</span>'+
    '<button class="btn ghost sm" data-act="delFile" data-i="'+i+'" aria-label="Видалити файл">&#10005;</button></div>').join("");
}
function kb(n){ return n<1024 ? n+" Б" : n<1048576 ? Math.round(n/1024)+" КБ" : (n/1048576).toFixed(1)+" МБ"; }
function attachFiles(list){
  const f = currentMarker(); if(!f) return;
  const max = 900*1024;
  Array.from(list).forEach(file=>{
    if(file.size > max){
      f.m.files.push({name:file.name, size:file.size, type:file.type, data:null});
      document.getElementById("fileList").innerHTML = filesHTML(f.m);
      toast("«"+file.name+"» більший за 900 КБ — збережено лише назву");
      return;
    }
    const r = new FileReader();
    r.onload = () => {
      f.m.files.push({name:file.name, size:file.size, type:file.type||"", data:r.result});
      document.getElementById("fileList").innerHTML = filesHTML(f.m);
      save();
    };
    r.readAsDataURL(file);
  });
}

/* ============ події ============ */
function actionTarget(e){ return e.target.closest("[data-act]"); }

document.addEventListener("click", e=>{
  const a = actionTarget(e); if(!a) return;
  const act = a.dataset.act;
  const bid = a.dataset.b, pid = a.dataset.p, v = a.dataset.v;

  if(act==="addBranch"){ addBranch(a.dataset.c); return; }
  if(act==="gotoCat"){
    ui.view="dashboard"; ui.focusId=null; render();
    const el = document.querySelector('[data-cat-band="'+a.dataset.c+'"]');
    if(el) el.scrollIntoView({block:"start", behavior:"smooth"});
    return;
  }
  if(act==="focusBranch"){ ui.view="focus"; ui.focusId=bid; ui.sel=null; render(); return; }
  if(act==="gotoDashboard"){ ui.view="dashboard"; ui.focusId=null; render(); return; }
  if(act==="editBranch"){ ui.sel={type:"branch", branchId:bid}; render(); return; }
  if(act==="selPhase"){ ui.sel={type:"phase", branchId:bid, phaseId:pid}; render(); return; }
  if(act==="closeEditPop"){ ui.sel = null; ui.chainCreate = false; render(); return; }
  if(act==="openMarker"){
    ui.sel={type:"marker", branchId:bid, markerId:a.dataset.m}; ui.page=null; render(); return;
  }
  if(act==="toggleDone"){
    const f = findMarker(bid, a.dataset.m); if(!f) return;
    const wasDone = f.m.status==="done";
    f.m.status = wasDone ? "todo" : "done";
    save();
    if(!wasDone){
      /* щойно закрили задачу — одразу пропонуємо створити наступну в тій самій гілці */
      ui.chainCreate = true;
      ui.sel = {type:"newMarker", date:todayISO(), branchId:f.br.id};
    }
    render(); return;
  }
  if(act==="setAgendaFilter"){ ui.agendaFilter = v; renderAgendaPageContent(); return; }
  if(act==="openAgendaPage"){ openAgendaPage(); return; }
  if(act==="openDataPage"){ openDataPage(); return; }
  if(act==="closePage"){ closePage(); return; }
  if(act==="openCluster"){ ui.sel = {type:"cluster", branchId:bid, ids:a.dataset.ids}; render(); return; }
  if(act==="openTaskPicker"){
    if(!allBranches().length){ toast("Спершу додайте дисципліну"); return; }
    const date = a.dataset.date || todayISO();
    const branchId = (ui.view==="focus" && ui.focusId) ? ui.focusId : allBranches()[0].br.id;
    ui.sel = {type:"newMarker", date, branchId};
    ui.page = null;
    render(); return;
  }
  if(act==="submitNewMarker"){
    const branchId = document.getElementById("nmBranch").value;
    const date = document.getElementById("nmDate").value || todayISO();
    const f = findBranch(branchId); if(!f) return;
    const m = markerAt(f.br, date);
    ui.sel = {type:"marker", branchId:f.br.id, markerId:m.id};
    save(); render(); return;
  }
  if(act==="chainAddAnother"){
    const branchId = (ui.sel && ui.sel.branchId) || allBranches()[0].br.id;
    ui.sel = {type:"newMarker", date:todayISO(), branchId};
    render(); return;
  }
  if(act==="chainFinish"){
    ui.chainCreate = false;
    ui.sel = null;
    render(); toast("Задачі додано на трекер"); return;
  }

  if(act==="editCategory"){ ui.sel={type:"category", categoryId:a.dataset.c}; render(); return; }
  if(act==="moveCat"){
    const idx = state.categories.findIndex(c=>c.id===a.dataset.c);
    const j = idx + Number(v);
    if(idx<0 || j<0 || j>=state.categories.length) return;
    const tmp = state.categories[idx]; state.categories[idx]=state.categories[j]; state.categories[j]=tmp;
    save(); render(); return;
  }
  if(act==="delCategory"){
    const cat = state.categories.find(c=>c.id===a.dataset.c);
    if(!cat || cat.branches.length) return;
    if(a.dataset.confirm!=="1"){ a.dataset.confirm="1"; a.textContent="Точно видалити?"; return; }
    state.categories = state.categories.filter(c=>c.id!==cat.id);
    ui.sel=null; save(); render(); toast("Категорію видалено"); return;
  }
  if(act==="movePhase"){
    const f = findBranch(bid); if(!f) return;
    const i = f.br.phases.findIndex(x=>x.id===pid);
    const j = i + Number(v);
    if(i<0 || j<0 || j>=f.br.phases.length) return;
    const A = f.br.phases[i], B = f.br.phases[j];
    const tmpN=A.name, tmpC=A.color, tmpO=A.note;
    A.name=B.name; A.color=B.color; A.note=B.note;
    B.name=tmpN; B.color=tmpC; B.note=tmpO;
    ui.sel = {type:"phase", branchId:f.br.id, phaseId:B.id};
    save(); render(); return;
  }

  if(act==="phaseColor" || act==="branchColor"){
    const f = findBranch(ui.sel.branchId); if(!f) return;
    if(act==="branchColor") f.br.color = v;
    else { const p=f.br.phases.find(x=>x.id===ui.sel.phaseId); if(p) p.color=v; }
    save(); render(); return;
  }
  if(act==="splitPhase"){
    const f=findBranch(ui.sel.branchId); const p=f.br.phases.find(x=>x.id===ui.sel.phaseId);
    const len = diffDays(p.start,p.end);
    if(len<1){ toast("Фаза закоротка, щоб її ділити"); return; }
    const mid = addDays(p.start, Math.floor(len/2));
    const np = {id:uid(), name:p.name+" — 2", color:tint(p.color,.22), start:addDays(mid,1), end:p.end, note:""};
    p.end = mid;
    f.br.phases.splice(f.br.phases.indexOf(p)+1, 0, np);
    ui.sel={type:"phase", branchId:f.br.id, phaseId:np.id};
    save(); render(); return;
  }
  if(act==="addPhaseAfter"){
    const f=findBranch(ui.sel.branchId); const p=f.br.phases.find(x=>x.id===ui.sel.phaseId);
    const i = f.br.phases.indexOf(p);
    const np = {id:uid(), name:"Нова фаза", color:PALETTE[(i+1)%PALETTE.length], start:addDays(p.end,1), end:addDays(p.end,15), note:""};
    const shift = diffDays(np.start, np.end)+1;
    for(let k=i+1;k<f.br.phases.length;k++){ const q=f.br.phases[k]; q.start=addDays(q.start,shift); q.end=addDays(q.end,shift); }
    f.br.phases.splice(i+1,0,np);
    ui.sel={type:"phase", branchId:f.br.id, phaseId:np.id};
    save(); render(); return;
  }
  if(act==="delPhase"){
    const f=findBranch(ui.sel.branchId);
    if(f.br.phases.length<=1){ toast("У гілці має лишитися хоча б одна фаза"); return; }
    f.br.phases = f.br.phases.filter(x=>x.id!==ui.sel.phaseId);
    ui.sel={type:"branch", branchId:f.br.id};
    save(); render(); return;
  }
  if(act==="appendPhase"){ const f=findBranch(bid); appendPhase(f.br); save(); render(); return; }
  if(act==="addMarkerAtToday"){
    const f=findBranch(bid);
    let d = todayISO();
    if(d < branchStart(f.br)) d = branchStart(f.br);
    if(d > branchEnd(f.br)) d = branchEnd(f.br);
    const m = markerAt(f.br, d);
    ui.sel = {type:"marker", branchId:f.br.id, markerId:m.id};
    save(); render(); return;
  }
  if(act==="shiftBranch"){
    const f=findBranch(bid), n=Number(v);
    f.br.phases.forEach(p=>{ p.start=addDays(p.start,n); p.end=addDays(p.end,n); });
    f.br.markers.forEach(m=>{ m.date=addDays(m.date,n); });
    save(); render(); return;
  }
  if(act==="delBranch"){
    if(a.dataset.confirm!=="1"){ a.dataset.confirm="1"; a.textContent="Точно видалити?"; return; }
    state.categories.forEach(c=>{ c.branches = c.branches.filter(x=>x.id!==bid); });
    if(ui.focusId===bid){ ui.view="dashboard"; ui.focusId=null; }
    ui.sel=null; save(); render(); toast("Гілку видалено"); return;
  }

  if(act==="mShape" || act==="mColor"){
    const f=currentMarker(); if(!f) return;
    if(act==="mShape") f.m.shape=v; else f.m.color=v;
    save(); render(); return;
  }
  if(act==="pickFile"){ document.getElementById("mFiles").click(); return; }
  if(act==="delFile"){ const f=currentMarker(); f.m.files.splice(Number(a.dataset.i),1);
    document.getElementById("fileList").innerHTML=filesHTML(f.m); save(); render(); return; }
  if(act==="delMarker"){
    if(a.dataset.confirm!=="1"){ a.dataset.confirm="1"; a.textContent="Точно видалити?"; return; }
    const f=currentMarker();
    if(f){ f.br.markers = f.br.markers.filter(x=>x.id!==f.m.id); ui.sel = {type:"branch", branchId:f.br.id}; }
    save(); render(); toast("Задачу видалено"); return;
  }
  if(act==="copyJson"){
    const box=document.getElementById("jsonBox"); box.select();
    navigator.clipboard.writeText(box.value).then(()=>toast("Скопійовано в буфер"), ()=>toast("Виділено — скопіюйте вручну"));
    return;
  }
  if(act==="applyJson"){
    try{
      const d = JSON.parse(document.getElementById("jsonBox").value);
      if(!d || !Array.isArray(d.categories)) throw new Error("формат");
      state = d; ui.sel=null; save(); closePage(); toast("Дані застосовано");
    }catch(err){ toast("Не вдалося прочитати JSON — перевірте формат"); }
    return;
  }
  if(act==="resetAll"){
    if(a.dataset.confirm!=="1"){ a.dataset.confirm="1"; a.textContent="Точно скинути?"; return; }
    state = seed(); ui.sel=null; save(); closePage(); toast("Повернуто приклад");
    return;
  }
});

/* поля вводу */
const LIVE_KEYS = new Set(["branchName","branchNote","phaseName","phaseNote","phaseColorCustom","branchCat","catName",
  "markerTitle","markerWho","markerDesc","markerStatus"]);
const DATE_KEYS = new Set(["phaseStart","phaseEnd","markerDate"]);
function applyFieldChange(el, key){
  if(key==="catName"){
    const cat = state.categories.find(c=>c.id===ui.sel.categoryId); if(!cat) return;
    cat.name = el.value; save(); renderRail(); renderCanvas(); return;
  }
  if(key==="markerTitle"||key==="markerDate"||key==="markerStatus"||key==="markerWho"||key==="markerDesc"){
    const f = currentMarker(); if(!f) return;
    const justClosed = key==="markerStatus" && el.value==="done" && f.m.status!=="done";
    if(key==="markerTitle") f.m.title = el.value || "Без назви";
    else if(key==="markerDate" && el.value) f.m.date = el.value;
    else if(key==="markerStatus") f.m.status = el.value;
    else if(key==="markerWho") f.m.assignees = el.value.split(",").map(s=>s.trim()).filter(Boolean);
    else if(key==="markerDesc") f.m.desc = el.value;
    save();
    if(justClosed){
      /* щойно закрили задачу зі статусу в хмарці — одразу пропонуємо створити наступну в тій самій гілці.
         блюримо select, інакше render() бачить активне поле всередині хмарки і не перемальовує її
         (той самий захист, що беріг курсор під час друку в текстових полях) */
      ui.chainCreate = true;
      ui.sel = {type:"newMarker", date:todayISO(), branchId:f.br.id};
      el.blur();
      render(); return;
    }
    renderRail(); renderCanvas(); return;
  }
  const f = findBranch(ui.sel && ui.sel.branchId); if(!f) return;
  const p = ui.sel.type==="phase" ? f.br.phases.find(x=>x.id===ui.sel.phaseId) : null;
  if(key==="branchName") f.br.name = el.value;
  else if(key==="branchNote") f.br.note = el.value;
  else if(key==="phaseName" && p) p.name = el.value;
  else if(key==="phaseNote" && p) p.note = el.value;
  else if(key==="phaseColorCustom" && p) p.color = el.value;
  else if(key==="phaseStart" && p && el.value){ p.start = el.value; if(p.start>p.end) p.end=p.start; normalizePhases(f.br); }
  else if(key==="phaseEnd" && p && el.value){ p.end = el.value; if(p.end<p.start) p.start=p.end; normalizePhases(f.br); }
  else if(key==="branchCat"){
    const target = state.categories.find(c=>c.id===el.value);
    if(target && target!==f.cat){
      f.cat.branches = f.cat.branches.filter(x=>x.id!==f.br.id);
      target.branches.push(f.br);
    }
  }
  save();
  renderRail(); renderCanvas();
  if(key==="phaseStart"||key==="phaseEnd"||key==="branchCat"||key==="phaseColorCustom") renderEditPop();
}

/* ============ старт: підписка на спільну дошку ============ */
let firstLoad = true;
if(firebaseReady) toast("Підключення до спільної дошки…");
boardRef.onSnapshot(snap=>{
  const remote = snap.exists ? snap.data() : null;
  if(remote && remote.categories){
    state = remote;
  } else if(!state){
    /* показуємо приклад ЛИШЕ локально, без запису в базу — доти дошка
       записувалась автоматично, і будь-який хибний "порожній" знімок
       (мережевий збій, холодний кеш) стирав реальні дані всієї команди */
    state = seed();
  }
  /* цей знімок прийшов з фонової синхронізації (не з локальної дії користувача) —
     не чіпаємо вже відкриту хмарку, щоб не зірвати клік чи "Точно видалити?" */
  suppressPopRerender = !!ui.sel;
  render();
  suppressPopRerender = false;
  if(firstLoad){
    firstLoad = false;
    toast(firebaseReady ? "" : "Firebase не налаштовано — дошка працює лише в цьому вікні, без спільного доступу.");
    requestAnimationFrame(scrollToToday);
  }
}, err=>{
  toast("Немає з'єднання з дошкою: "+(err&&err.message||err));
});
})();
</script>
